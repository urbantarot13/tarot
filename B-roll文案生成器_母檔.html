<title>B-roll 文案生成器</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap">
<style>
/* Layout: 左側主工作區（分頁步驟）＋右側常駐「定位卡」，手機時定位卡移到下方 */
:root{
  --bg:#F5F7F3; --surface:#FFFFFF; --surface-2:#EEF2EC;
  --ink:#2C292C; --text:#454145; --muted:#7A7778; --line:#DCE3DA;
  --sage:#688D81; --sage-ink:#4F7266; --sage-soft:#E3ECE7;
  --gold:#B0823A; --gold-fill:#E1BD83; --gold-soft:#F8EEDC;
  --lav:#7376AE; --lav-soft:#ECECF6;
  --on-accent:#FFFFFF; --on-gold:#2C2416;
  --f-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-num:"Cormorant Garamond","Times New Roman",serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131C12; --surface:#1A2718; --surface-2:#22321F;
  --ink:#EEF1EA; --text:#CDD3C8; --muted:#8D978A; --line:#2F3F2C;
  --sage:#8DB2A5; --sage-ink:#A7C7BB; --sage-soft:#233830;
  --gold:#E6C48E; --gold-fill:#E1BD83; --gold-soft:#372E1F;
  --lav:#B3B5DC; --lav-soft:#2A2B3C;
  --on-accent:#0F1A14; --on-gold:#2C2416; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#131C12; --surface:#1A2718; --surface-2:#22321F;
  --ink:#EEF1EA; --text:#CDD3C8; --muted:#8D978A; --line:#2F3F2C;
  --sage:#8DB2A5; --sage-ink:#A7C7BB; --sage-soft:#233830;
  --gold:#E6C48E; --gold-fill:#E1BD83; --gold-soft:#372E1F;
  --lav:#B3B5DC; --lav-soft:#2A2B3C;
  --on-accent:#0F1A14; --on-gold:#2C2416; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 64px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--f-display);color:var(--ink);margin:0;text-wrap:balance;line-height:1.35}
h1{font-size:clamp(26px,4vw,34px)}
h2{font-size:21px}
h3{font-size:17px}
p{margin:0}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sage);outline-offset:2px}

.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
.eyebrow{font-family:var(--f-num);font-style:italic;font-size:16px;color:var(--sage);letter-spacing:.04em}
.sub{color:var(--muted);font-size:14px;max-width:62ch;margin-top:4px}
.ai-pill{display:inline-flex;align-items:center;gap:8px;font-size:13px;padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.ai-pill i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.ai-pill.on i{background:var(--sage)} .ai-pill.on{color:var(--sage-ink)}
.ai-pill.off i{background:var(--gold)}

.steps{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;border-bottom:1px solid var(--line)}
.steps button{border:0;background:none;padding:10px 14px 12px;cursor:pointer;color:var(--muted);display:flex;align-items:baseline;gap:8px;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.steps button b{font-family:var(--f-num);font-size:20px;font-weight:500;color:inherit}
.steps button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--sage)}
.steps button[aria-selected="true"] b{color:var(--sage)}
.steps .done-dot{width:6px;height:6px;border-radius:50%;background:var(--sage);align-self:center}

.grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
main{display:flex;flex-direction:column;gap:20px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;min-width:0}
.panel-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px 16px;margin-bottom:16px}
.muted{color:var(--muted)} .small{font-size:13px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:10px;padding:10px 18px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;color:var(--ink);transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--sage)}
.btn.primary{background:var(--sage);border-color:var(--sage);color:var(--on-accent)}
.btn.primary:hover{background:var(--sage-ink);border-color:var(--sage-ink)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted);padding:8px 10px}
.btn.ghost:hover{color:var(--ink)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

.chat{display:flex;flex-direction:column;gap:14px;max-height:min(62vh,640px);overflow-y:auto;padding:4px 4px 8px;scroll-behavior:smooth}
.msg{display:flex;gap:10px;align-items:flex-start;max-width:88%}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.avatar{flex:none;width:34px;height:34px;border-radius:50%;background:var(--sage-soft);color:var(--sage-ink);display:grid;place-items:center;font-family:var(--f-display);font-size:14px;font-weight:700}
.bubble{background:var(--surface-2);border-radius:4px 14px 14px 14px;padding:10px 14px;min-width:0;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me .bubble{background:var(--sage);color:var(--on-accent);border-radius:14px 4px 14px 14px}
.msg.follow .bubble{background:var(--lav-soft);border-left:3px solid var(--lav)}
.stage-tag{display:block;font-size:12px;color:var(--sage-ink);font-weight:500;letter-spacing:.06em;margin-bottom:2px}
.hint{display:block;font-size:13px;color:var(--muted);margin-top:6px}
.typing{color:var(--muted);font-size:14px;padding-left:44px}
.composer{border-top:1px solid var(--line);margin-top:14px;padding-top:14px;display:flex;flex-direction:column;gap:10px}
textarea,input[type=text],select{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:10px 12px;resize:vertical}
textarea:focus,input:focus,select:focus{border-color:var(--sage);outline:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;cursor:pointer;font-size:14px}
.chip[aria-pressed="true"]{background:var(--sage-soft);border-color:var(--sage);color:var(--sage-ink);font-weight:500}
.progress{height:4px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--sage);transition:width .3s}

.side{position:sticky;top:16px;display:flex;flex-direction:column;gap:16px}
@media (max-width:900px){.side{position:static}}
.poscard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.poscard header{background:var(--sage);color:var(--on-accent);padding:14px 18px}
.poscard header h3{color:inherit;font-size:16px}
.poscard header p{font-size:12px;opacity:.85}
.poscard .body{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.formula-line{font-family:var(--f-display);font-size:15px;color:var(--ink);line-height:1.8}
.formula-line em{font-style:normal;color:var(--sage-ink);border-bottom:1px dashed var(--sage)}
.formula-line .x{font-family:var(--f-num);color:var(--gold);padding:0 4px}
.kv{display:grid;grid-template-columns:72px minmax(0,1fr);gap:4px 10px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;color:var(--ink);overflow-wrap:anywhere}
.gates{display:flex;flex-direction:column;gap:6px;font-size:13px}
.gate{display:flex;gap:8px;align-items:center}
.gate i{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line);flex:none;display:grid;place-items:center;font-style:normal;font-size:10px}
.gate.ok i{background:var(--sage);border-color:var(--sage);color:var(--on-accent)}
.cta-mini{background:var(--gold-soft);border-radius:10px;padding:10px 12px;font-size:13px}
.cta-mini b{color:var(--gold)}

.stack{display:flex;flex-direction:column;gap:18px}
.highlights{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.hl{background:var(--gold-soft);border-radius:12px;padding:14px}
.hl h4{margin:0 0 4px;font-family:var(--f-display);color:var(--ink);font-size:15px}
.hl p{font-size:13px}
.obs{font-family:var(--f-display);font-size:17px;color:var(--ink);line-height:1.8;border-left:3px solid var(--sage);padding:4px 0 4px 16px}
.dirs{display:grid;gap:10px}
.dir{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;padding:14px;border:1px solid var(--line);border-radius:12px;cursor:pointer;background:var(--surface)}
.dir[aria-checked="true"]{border-color:var(--sage);background:var(--sage-soft)}
.radio{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);margin-top:3px}
.dir[aria-checked="true"] .radio{border-color:var(--sage);box-shadow:inset 0 0 0 4px var(--surface);background:var(--sage)}
.dir h4{margin:0;font-family:var(--f-display);color:var(--ink);font-size:16px}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:6px;background:var(--lav-soft);color:var(--lav);margin-left:6px;vertical-align:2px;font-family:var(--f-body)}
.tag.rec{background:var(--gold-soft);color:var(--gold)}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:560px){.fields{grid-template-columns:minmax(0,1fr)}}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:13px;color:var(--muted);font-weight:500}
.notes{display:grid;gap:10px}
details.box{border:1px solid var(--line);border-radius:12px;padding:12px 16px;background:var(--surface)}
details.box summary{cursor:pointer;font-weight:500;color:var(--ink)}
.caution{background:var(--lav-soft);border-radius:10px;padding:12px 14px;font-size:14px}

.set-row{display:grid;grid-template-columns:92px minmax(0,1fr);gap:10px;align-items:start}
@media (max-width:560px){.set-row{grid-template-columns:minmax(0,1fr)}}
.set-row > span{font-size:13px;color:var(--muted);padding-top:7px}
.fchips .chip{font-size:13px;padding:6px 12px}
.fchips .chip b{font-family:var(--f-num);font-size:16px;margin-right:4px}
.hookbank{display:grid;gap:8px}
.hookitem{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
.hookitem[data-picked="true"]{border-color:var(--gold-fill);background:var(--gold-soft)}
.fnum{font-family:var(--f-num);font-size:20px;color:var(--sage);min-width:26px;text-align:center}
.hookitem .h{font-family:var(--f-display);color:var(--ink)}
.hookitem .w{font-size:12px;color:var(--muted)}
.star{border:0;background:none;cursor:pointer;font-size:20px;color:var(--muted);padding:4px 6px}
.star[aria-pressed="true"]{color:var(--gold)}

/* 故事腳本 */
.script{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.script-head{padding:18px 20px;background:var(--surface-2);display:flex;flex-direction:column;gap:6px}
.script-head .meta{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:13px;color:var(--muted);align-items:center}
.script-head .hook{font-family:var(--f-display);font-size:22px;color:var(--ink);line-height:1.45;text-wrap:balance}
.alts{font-size:13px;color:var(--muted)}
.angle{font-size:14px;color:var(--text)}
.script-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:0}
@media (max-width:760px){.script-body{grid-template-columns:minmax(0,1fr)}}
.vo-col{padding:20px;border-right:1px solid var(--line);min-width:0}
@media (max-width:760px){.vo-col{border-right:0;border-bottom:1px solid var(--line)}}
.col-label{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:500;margin-bottom:10px;display:flex;justify-content:space-between;gap:8px}
.vo-text{font-family:var(--f-display);font-size:16px;line-height:2;color:var(--ink);display:flex;flex-direction:column}
.vo-text .gap{height:10px}
.vo-text .cta-line{color:var(--gold)}
.vo-text .cta-line b{background:var(--gold-fill);color:var(--on-gold);padding:0 6px;border-radius:5px;font-weight:700}
.board-col{padding:20px;min-width:0}
.beats{display:flex;flex-direction:column;gap:14px}
.beat{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px}
.beat .bn{font-family:var(--f-num);font-size:22px;color:var(--sage);line-height:1.1;text-align:center}
.beat h5{margin:0 0 4px;font-size:13px;color:var(--lav);font-weight:500;letter-spacing:.04em}
.beat ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.beat li{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline;font-size:14px}
.beat li .l{color:var(--ink);flex:1 1 180px;min-width:0}
.shot{display:inline-block;font-size:12px;padding:1px 8px;border-radius:6px;background:var(--sage-soft);color:var(--sage-ink);white-space:nowrap}
.shot.black{background:var(--ink);color:var(--bg)}
.shot.proof{background:var(--gold-soft);color:var(--gold)}
.shot-note{font-size:12px;color:var(--muted);flex-basis:100%}
.cta-box{background:var(--gold-soft);border-radius:12px;padding:12px 14px;display:grid;gap:4px;margin-top:4px}
.cta-box .kw{font-family:var(--f-display);font-size:17px;color:var(--ink)}
.cta-box .kw b{background:var(--gold-fill);color:var(--on-gold);padding:0 8px;border-radius:6px}
.post{padding:16px 20px;font-size:14px;white-space:pre-wrap;border-top:1px solid var(--line)}
.post .tags{color:var(--sage-ink);margin-top:6px}
.script-foot{display:flex;flex-wrap:wrap;gap:8px;padding:12px 20px 18px;border-top:1px solid var(--line)}
.prep{display:flex;flex-wrap:wrap;gap:6px;padding:12px 20px;border-top:1px solid var(--line);font-size:13px;align-items:center}

.thinking{display:flex;align-items:center;gap:12px;padding:16px;background:var(--surface-2);border-radius:12px;color:var(--muted)}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--sage);animation:sp 1s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}.chat{scroll-behavior:auto}}
.empty{text-align:center;padding:36px 16px;display:flex;flex-direction:column;align-items:center;gap:12px}
.empty p{max-width:44ch;color:var(--muted)}
.banner{background:var(--lav-soft);border-radius:12px;padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;font-size:14px}

.lib{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.fcard{border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.fcard.new{border-color:var(--gold-fill)}
.fcard .n{font-family:var(--f-num);font-size:30px;color:var(--sage);line-height:1}
.fcard .pat{font-family:var(--f-display);color:var(--ink);font-size:16px}
.fcard ul{margin:0;padding-left:18px;font-size:13px;color:var(--muted)}
.fit{font-size:12px;color:var(--gold)}
.fit span{color:var(--muted)}
.tips{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.tip{background:var(--surface-2);border-radius:12px;padding:14px}
.tip h4{margin:0 0 4px;font-family:var(--f-display);color:var(--ink);font-size:15px}
.tip p{font-size:13px}
.arc{display:grid;gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.arc-row{display:grid;grid-template-columns:200px minmax(0,1fr);border-top:1px solid var(--line)}
.arc-row:first-child{border-top:0}
@media (max-width:620px){.arc-row{grid-template-columns:minmax(0,1fr)}}
.arc-meta{background:var(--surface-2);padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.arc-meta b{font-family:var(--f-display);color:var(--ink);font-size:15px}
.arc-meta b span{font-family:var(--f-num);color:var(--sage);font-size:18px;margin-right:6px}
.arc-meta p{font-size:12px;color:var(--muted)}
.arc-lines{padding:12px 16px;font-family:var(--f-display);color:var(--ink);line-height:1.9;display:flex;flex-direction:column;justify-content:center}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">Urban Legend Tarot · Reels Studio</div>
      <h1>B-roll 文案生成器</h1>
      <p class="sub">先訪談，找出學員自己的故事與利基市場，再依照他的故事原型寫成一句一行、可以直接錄音的 B-roll 口播，每句配好畫面，最後用留言關鍵字收尾。</p>
    </div>
    <div class="row">
      <span class="ai-pill" id="aiPill"><i></i><span>檢查 AI 連線中</span></span>
      <button class="btn ghost sm" id="resetBtn" type="button">重新開始</button>
    </div>
  </header>

  <nav class="steps" role="tablist" id="steps"></nav>

  <div class="grid">
    <main id="main"></main>
    <aside class="side" id="side"></aside>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
/* ===== 小都設定區 =====
   母檔請保持 apiKey 空白。學員版由母檔右側「小都專用・產生學員版」自動產生，不用手動改這裡。 */
window.XD_CONFIG={apiKey:'',model:'claude-sonnet-5-5'};
</script>
<script>
/* ============ 資料 ============ */
const FORMULAS=[
 {id:1,name:'時間＋目標',pat:'如何在［特定時間範圍］內達成［特定目標］',ex:['如何在一個月內在 Instagram 獲得 10000 個粉絲','如何在 7 天內撰寫並開賣電子書','如何在兩週內打造成功流量變現的 Skool 社群'],fit:2,use:'適合已經有成果、想示範方法的人。故事成分少，較偏教學。'},
 {id:2,name:'情境困惑',pat:'在你的［特定情境或年齡］感到困惑嗎？',ex:['20 歲的你感到迷茫嗎？','在辦公桌前的你感到迷茫嗎？','身為自媒體創作者感到迷茫嗎？'],fit:4,use:'直接點名 TA 的處境，讓 TA 一看封面就覺得「在說我」。'},

/* 連線方式：在 claude.ai 開啟時用觀看者的 Claude 帳號；學員版檔案用小都設定區裡的 API 金鑰 */
const SOURCE_HTML='<!doctype html>\n'+document.documentElement.outerHTML;
const CFG=window.XD_CONFIG||{};
const KC={key:/^sk-ant-/.test(String(CFG.apiKey||'').trim())?String(CFG.apiKey).trim():'',model:CFG.model||'claude-sonnet-5-5'};
const API_MODELS=[['claude-sonnet-5-5','Sonnet 5.5（推薦，品質和速度平衡）'],['claude-opus-5-5','Opus 5.5（最會寫，比較慢也比較貴）'],['claude-haiku-5-5','Haiku 5.5（最快最便宜）']];
const IN_CLAUDE=!!(window.claude&&window.claude.use);
let sample=null, ai=IN_CLAUDE?'checking':(KC.key?'key':'off'), ownerMsg=null;
(async()=>{await Promise.resolve();if(!IN_CLAUDE)return;try{sample=await window.claude.use('sample')}catch(e){sample=null}ai=sample?'on':(KC.key?'key':'off');renderPill();renderSide();if(S.tab==='niche'||S.tab==='copy')render()})();
setTimeout(()=>{if(ai==='checking'){ai=KC.key?'key':'off';renderPill();renderSide();render()}},11000);
function aiOK(){return (ai==='on'&&!!sample)||(ai==='key'&&!!KC.key)}
function parseLoose(t){t=String(t||'').trim();try{return JSON.parse(t)}catch(e){}
 const m=t.match(/```(?:json)?\s*([\s\S]*?)```/);if(m){try{return JSON.parse(m[1])}catch(e){}}
 const a=Math.min(...['{','['].map(c=>{const i=t.indexOf(c);return i<0?1e9:i})),b=Math.max(t.lastIndexOf('}'),t.lastIndexOf(']'));
 if(a<b){try{return JSON.parse(t.slice(a,b+1))}catch(e){}}throw{code:'invalid_json',text:t}}
async function apiCall(prompt,opts={},key=KC.key,modelPref=KC.model,version='2023-06-01'){
 const model=opts.modelTier==='quick'?'claude-haiku-5-5':(modelPref||'claude-sonnet-5-5');
 let res;
 try{res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',signal:opts.signal,headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':version,'anthropic-dangerous-direct-browser-access':'true'},
  body:JSON.stringify({model,max_tokens:opts.modelTier==='quick'?600:12000,messages:[{role:'user',content:prompt+'\n\n只回覆 JSON，不要加任何說明文字。'}]})})}
 catch(e){if(e&&e.name==='AbortError')throw{code:'cancelled'};throw{code:'network'}}
 let body={};try{body=await res.json()}catch(e){}
 if(!res.ok){const msg=(body.error&&body.error.message)||'';const type=body.error&&body.error.type;
  if(res.status===400&&/anthropic-version/i.test(msg)&&version==='2023-06-01')return apiCall(prompt,opts,key,modelPref,'2026-10-21');
  if(res.status===401||type==='authentication_error')throw{code:'bad_key'};
  if(res.status===403||type==='permission_error')throw{code:'no_permission'};
  if(/credit|balance|billing|spend/i.test(msg))throw{code:'no_credit'};
  if(res.status===404||type==='not_found_error')throw{code:'bad_model'};
  if(res.status===429)throw{code:'rate_limited'};
  if(res.status===529||type==='overloaded_error')throw{code:'overloaded'};
  throw{code:'upstream_error'}}
 return (body.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('')}
async function askJSON(prompt,opts={}){

 throw{code:'not_granted'}}
const ERRTXT={bad_key:'這份檔案的 AI 鑰匙已經更新了，請到小都那裡下載最新版的檔案',no_permission:'這份檔案的 AI 鑰匙已經更新了，請到小都那裡下載最新版的檔案',no_credit:'AI 額度暫時用完了，請通知小都',bad_model:'AI 模型設定有問題，請通知小都',overloaded:'AI 現在很忙，等一分鐘再按一次',network:'連不上 AI，請確認網路後再按一次',rate_limited:'使用太頻繁了，休息一分鐘再試',invalid_json:'AI 回覆格式跑掉了，再按一次試試'};
function aiErr(e){const c=e&&e.code;
 if(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(c)){ai=KC.key?'key':'off';renderPill();renderSide();toast(KC.key?'改用學員版的 AI 連線':'目前沒有連上 AI，先用範本模式');return}
 if(c==='cancelled')return;
 toast(ERRTXT[c]||'連線中斷了，再按一次試試')}

 S.log.push({from:'xd',text:q.q,hint:q.hint||'',stage:q.stage})}

async function submitAnswer(val){const q=QUESTIONS[S.qi];const shown=Array.isArray(val)?val.join('、'):val;S.log.push({from:'me',text:shown});
 if(S.pendingFollow){S.answers[q.id]=(ans(q.id)?ans(q.id)+'\n（補充）':'')+shown;S.pendingFollow=null;S.log.push({from:'xd',text:'很好，這樣清楚多了。'});nextQ();return}
 S.answers[q.id]=val;syncCardFromAnswer(q.id,val);
 let reply='',follow='';
 if(q.type==='text'&&aiOK()){busy='chat';render();
  try{const r=await askJSON(`你是「小都」，台灣塔羅創業導師，正在訪談一位想建立個人品牌的學員。目的有兩個：挖出只屬於他、能拍成 B-roll 故事影片的真實經歷，以及找到他的利基市場（我是誰 × 我想幫誰 × 我解決什麼問題）。
${RULES}
到目前為止的訪談：
${QUESTIONS.slice(0,S.qi).map(x=>`Q：${x.q}\nA：${ans(x.id)||'（跳過）'}`).join('\n')}
現在這題：${q.q}
學員回答：${shown}

請回覆：
1. reply：一到兩句回應。要具體引用他剛說的內容，指出值得被稱讚或可以變成影片素材的地方。如果是辛苦或悲傷的經歷，先溫柔地接住，不要急著誇。不要空泛誇獎，不要問問題。
2. followUp：${q.gate?'只有在回答太模糊時才追問一句。標準：故事要有具體的人、時間、地點、動作或一句話，能讓人看見畫面；TA 要具體到年齡、正在經歷的事、情緒狀態；問題要是一個具體場景；差異要是只有他才有的背景或經歷。已經夠具體就給空字串。':'一律給空字串。'}
只回 JSON：{"reply":"…","followUp":""}`,{modelTier:'quick'});
   reply=String(r?.reply||'').trim();follow=q.gate?String(r?.followUp||'').trim():''}
  catch(e){aiErr(e)}
  busy=null}
 if(!reply)reply=CANNED[S.qi%CANNED.length];
 S.log.push({from:'xd',text:reply});
 if(follow){S.pendingFollow=follow;S.log.push({from:'xd',text:follow,follow:true});save();render();focusBox();return}
 nextQ()}

function syncCardFromAnswer(id,val){const c=S.card;
 if(id==='goal'){c.ctaGoal=[].concat(val)[0];if(!c.keyword)c.keyword=defaultKeyword()}
 if(id==='form'&&!c.model)c.model=mapModel(val);
 if(id==='persona'&&!c.persona)c.persona=mapPersona(val)}
function mapModel(arr){arr=[].concat(arr);if(arr.some(a=>a.includes('實體')))return MODELS[0];if(arr.some(a=>a.includes('一對一')))return MODELS[1];if(arr.some(a=>a.includes('教學')))return MODELS[2];if(arr.some(a=>a.includes('B2B')))return MODELS[3];return ''}
function mapPersona(arr){arr=[].concat(arr).join();if(arr.includes('陪伴'))return'療癒陪伴型';if(arr.includes('做東西'))return'職人手作型';if(arr.includes('分析'))return'知識教學型';if(arr.includes('儀式'))return'儀式能量型';if(arr.includes('露臉'))return'知識教學型';return''}
function defaultKeyword(){const c=S.card,g=c.ctaGoal||'',o=(c.offer||'')+ans('form');
 if(o.includes('蠟燭'))return'蠟燭';if(o.includes('水晶'))return'水晶';if(g.includes('預約'))return'預約';if(g.includes('招生'))return'上課';if(g.includes('漲粉'))return'追蹤';return'塔羅'}

async function analyze(){if(!aiOK())return;busy='niche';render();ctl=new AbortController();
 try{const r=await askJSON(`你是「小都」，台灣塔羅創業導師，做了五年塔羅品牌、帶過 200 多位學生。請根據以下訪談，幫這位學員找出利基市場。
原則：
- 利基市場 = 我是誰 × 我想幫誰 × 我解決什麼問題。
- 不是每個人都適合做教育。依照他的人格與意願，推薦 B2C 實體產品、B2C 一對一服務、教育課程／社群、B2B 方案之中最適合的，用建議的口吻，不要命令。
- 稱讚要具體，引用他說過的事。找出他「值得被稱讚、又剛好符合市場需求」的地方。他的人生經歷常常就是他最能幫到的那群人。
- TA 要具體到能看見一張臉；問題要是一個具體場景；差異要是他獨有的。
- 誠實：如果目標和現況有落差，溫和直接地說。
${RULES}

訪談內容：
${interviewText()}

只回 JSON，格式：
{"highlights":[{"title":"8字內","why":"一到兩句"}],
"persona":"從 ${PERSONAS.join('、')} 選一個",
"personaWhy":"一句",
"directions":[{"name":"方向名稱","model":"從 ${MODELS.join('、')} 選一個","offer":"具體產品或服務名稱","why":"一到兩句","firstStep":"一句"}],
"recommended":0,
"card":{"name":"","age":"","past":"以前的身分（短）","identity":"我是…（身分背景，30字內）","audience":"具體 TA（30字內）","problem":"具體場景（30字內）","offer":"","model":"","persona":"","highlight":"","endpoint":"","ctaGoal":"從 ${GOALS.join('、')} 選一個，優先依照學員的選擇","keyword":"留言關鍵字，2-4字，例如 塔羅創業、蠟燭、水晶、預約","oneLiner":"我是＿＿，專門幫＿＿解決＿＿。"},
"gates":{"audience":true,"problem":true,"difference":true},
"observation":"一段『聽完你說的，我有一個觀察…你覺得這個方向對嗎？』",

highlights 給 3 個，directions 給 2 到 3 個，card 要對應 recommended 那個方向。`,{signal:ctl.signal});
  if(!r||!Array.isArray(r.directions))throw{code:'invalid_json'};

 catch(e){aiErr(e)}busy=null;render()}

function thinking(t){return `<div class="thinking"><span class="spin"></span><span>${esc(t)}</span></div>`}
function shotClass(s){s=String(s||'');return s.includes('黑畫面')?'black':(s.includes('截圖')?'proof':'')}
function groupBeats(lines){const out=[];(lines||[]).forEach(l=>{const last=out[out.length-1];if(last&&last.beat===l.beat)last.items.push(l);else out.push({beat:l.beat,items:[l]})});return out}
function viewScript(s,i){const f=FORMULAS.find(x=>x.id===Number(s.formula));const chars=voChars(s);const vl=voLines(s).length;
 const groups=groupBeats(s.lines);
 const vo=groups.map((g,gi)=>(gi?'<span class="gap"></span>':'')+g.items.map(l=>`<span>${esc(l.vo)}</span>`).join('')).join('')+
   (s.cta?.lines?.length?'<span class="gap"></span>'+s.cta.lines.map(l=>`<span class="cta-line">${esc(l).replace(/「([^」]+)」/,'「<b>$1</b>」')}</span>`).join(''):'');

const COPY_RULES=`這是 B-roll 故事型短影片：畫面是學員自己的照片和手機影片，大約每 2 到 3 秒切一個畫面，一句口播就是一行字幕。觀眾靠「錄音口播＋字幕」聽完一個人的故事。

最重要的原則：故事必須是「這個學員自己的」。
- 先找到他訪談裡最有溫度、最具體的那個畫面或那句話，整支影片從那裡長出來。不要套用任何人的人生模板。

寫法：
- 一句一行，每句 8 到 22 字，像在跟朋友說自己的故事。不要說教、不要堆形容詞、不要口號。
- 第一人稱，只講真實發生過的事，具體到人、時間、地點、數字。只能用訪談裡有的事實，不可捏造經歷、數字、收入或客人。
- 用學員自己的用詞和說話方式，至少保留一句他在訪談裡的原話或接近原話的句子。
- 要有一句真心話（脆弱、矛盾、沒說出口的感受），用他自己的方式說，不要套固定句型。

const SHOT_FOR=[[/低潮|離開|那一刻|那個人/,'空景（窗邊、街道、車窗）'],[/原本|處境|別人眼中|發生/,'以前工作或打工的照片'],[/小事|工作|做這件事|越做|一天/,'工作或製作過程'],[/成果|被需要|發現/,'成果截圖（收入、訂單、帳號）'],[/陪伴|給更多人|帶誰/,'學生、客人或朋友合照']];
function templateScripts(picked,n){const x=ctx();const sy=S.story||storyFromAnswers();const a=archOf(sy.arch);
 const ids=picked.length?picked.map(h=>Number(h.formula)):(S.set.mode==='pick'&&S.set.picks.length?S.set.picks:[2,3,5]).slice(0,n);
 const lines=[];a.beats.forEach((b,bi)=>{const src=(BEAT_SRC.find(([re])=>re.test(b))||[])[1];const shot=(SHOT_FOR.find(([re])=>re.test(b))||[])[1]||'現在的生活自拍';
  if(bi===0){lines.push({beat:b,vo:sy.openingLine||short(ans('moment'),22)||`［用「${sy.opening}」開場的第一句］`,shot:'空景（窗邊、街道、車窗）',shotNote:''});lines.push({beat:b,vo:'［再一句，把畫面說得更具體：時間、地點、動作］',shot:'手部或身體細節特寫',shotNote:''});return}

 return ids.map((id,k)=>({formula:id,hook:picked[k]?.hook||templateHook(id),hookAlts:[],arch:a.id,opening:sy.opening,angle:`範本骨架（${a.name}）：把［］換成自己的話，一句一行，再照著錄音。`,

  </div></section>
 <section class="panel stack">
  <div><h2>封面標題公式・創業者專用版</h2><p class="muted small" style="margin-top:4px">封面標題放在影片上方，負責讓 TA 停下來；口播第一句負責開始說故事，兩個分開寫。★ 越多，越適合 B-roll 故事型影片。</p></div>
  <div class="lib">${FORMULA_ORDER.map(id=>FORMULAS.find(f=>f.id===id)).map(f=>`<div class="fcard"><span class="n">${f.id}</span><div class="pat">${esc(f.pat)}</div><div class="fit">${'★'.repeat(f.fit)}<span>${'★'.repeat(5-f.fit)}</span> <span>B-roll 故事適配</span></div><p class="small">${esc(f.use)}</p><ul>${f.ex.map(e=>`<li>${esc(e)}</li>`).join('')}</ul></div>`).join('')}</div>
 </section>
 <section class="panel stack"><h2>錄音小提醒</h2>
  <div class="tips">
   <div class="tip"><h4>每秒約 4–5 個字</h4><p>60 秒影片大約 18 句、270 字。字太多就刪句子，不要加快語速。</p></div>
   <div class="tip"><h4>一句一句錄</h4><p>每句前後留半秒空白，剪輯時一句對一個畫面最好對。</p></div>
   <div class="tip"><h4>手機靠近嘴巴</h4><p>在衣櫃或棉被旁邊錄，回音最少。講的時候想像對面坐著你的 TA。</p></div>
  </div></section>`}
/* ============ 事件 ============ */
document.addEventListener('click',e=>{const t=e.target.closest('button,[data-dir],[data-story]');if(!t||t.id==='resetBtn'||t.closest('#steps'))return;const a=t.dataset.act;
 if(a==='send'){const v=$('#ansBox').value.trim();if(!v){toast('先寫一點點也好');return}submitAnswer(v)}
 else if(a==='sendChips'){if(!chipSel.length){toast('至少選一個，或按先跳過');return}submitAnswer(QUESTIONS[S.qi].multi?chipSel.slice():[chipSel[0]])}
 else if(a==='skip'){if(S.pendingFollow){S.pendingFollow=null;S.log.push({from:'me',text:'（不補充）'});nextQ()}else{S.log.push({from:'me',text:'（先跳過）'});nextQ()}}
 else if(a==='toNiche'){S.tab='niche';save();render();window.scrollTo({top:0})}
 else if(a==='goInterview'){S.tab='interview';save();render()}
 else if(a==='toCopy'){S.tab='copy';save();render();window.scrollTo({top:0})}
 else if(a==='analyze')analyze();
 else if(a==='findStory')findStory();
 else if(a==='buildStudent')buildStudent(false);
 else if(a==='buildForce')buildStudent(true);
 else if(a==='hooks')genHooks();
 else if(a==='gen')genScripts();
 else if(a==='stop'){ctl&&ctl.abort()}
 else if(a==='loadExample'){const tab=S.tab==='interview'?'copy':S.tab;S={...fresh(),answers:JSON.parse(JSON.stringify(EXAMPLE.answers)),niche:JSON.parse(JSON.stringify(EXAMPLE.niche)),card:{...EXAMPLE.niche.card},scripts:JSON.parse(JSON.stringify(EXAMPLE.scripts)),stories:JSON.parse(JSON.stringify(EXAMPLE.stories)),storyIdx:0,story:{...EXAMPLE.stories[0]},qi:QUESTIONS.length,example:true,tab};
  S.log=[{from:'xd',text:'（範例學員「小晴」的訪談已完成，答案可以在「利基定位」的訪談筆記裡看到。）'}];save();render();toast('已載入範例學員')}
 else if(a==='clearExample'){S=fresh();save();render()}
 else if(t.dataset.chip!=null){const v=t.dataset.chip;const q=QUESTIONS[S.qi];if(q.multi){chipSel=chipSel.includes(v)?chipSel.filter(x=>x!==v):[...chipSel,v]}else chipSel=[v];
  document.querySelectorAll('#chipBox .chip').forEach(c=>c.setAttribute('aria-pressed',chipSel.includes(c.dataset.chip)))}
 else if(t.dataset.dir!=null)pickDir(Number(t.dataset.dir));
 else if(t.dataset.story!=null)pickStory(Number(t.dataset.story));
 else if(t.dataset.len){S.set.len=Number(t.dataset.len);keepNote();save();render()}
 else if(t.dataset.mode){S.set.mode=t.dataset.mode;keepNote();save();render()}
 else if(t.dataset.count){S.set.count=Number(t.dataset.count);keepNote();save();render()}
 else if(t.dataset.f){const id=Number(t.dataset.f);const p=S.set.picks;S.set.picks=p.includes(id)?p.filter(x=>x!==id):[...p,id].slice(-3);keepNote();save();render()}
 else if(t.dataset.pick!=null){const i=Number(t.dataset.pick);S.picked=S.picked.includes(i)?S.picked.filter(x=>x!==i):[...S.picked,i].slice(-3);keepNote();save();render()}
 else if(t.dataset.copy){copy(scriptText(S.scripts[Number(t.dataset.i)],t.dataset.copy))}
});
function keepNote(){const n=$('#noteBox');if(n)S.set.note=n.value}
document.addEventListener('keydown',e=>{if(e.target.id==='ansBox'&&e.key==='Enter'&&(e.metaKey||e.ctrlKey)){e.preventDefault();$('[data-act="send"]')?.click()}
 if(e.target.dataset?.dir!=null&&(e.key==='Enter'||e.key===' ')){e.preventDefault();pickDir(Number(e.target.dataset.dir))}
 if(e.target.dataset?.story!=null&&(e.key==='Enter'||e.key===' ')){e.preventDefault();pickStory(Number(e.target.dataset.story))}});
document.addEventListener('input',e=>{const t=e.target;
 if(t.dataset.card){S.card[t.dataset.card]=t.value;save();renderSide()}
 else if(t.dataset.storyF){S.story=S.story||{};S.story[t.dataset.storyF]=t.value;save();renderSide()}
 else if(t.dataset.ans){S.answers[t.dataset.ans]=t.value;save()}
 else if(t.id==='noteBox'){S.set.note=t.value;save()}});
document.addEventListener('change',e=>{const t=e.target;if(t.tagName==='SELECT'&&t.dataset.card){S.card[t.dataset.card]=t.value;save();renderSide()}
 if(t.tagName==='SELECT'&&t.dataset.storyF){S.story=S.story||{};S.story[t.dataset.storyF]=t.value;save();render()}});

render();
</script>
