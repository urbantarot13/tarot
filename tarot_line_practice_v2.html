<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>塔羅占卜 LINE 接單練習器 · 小都塔羅</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --dark: #1e1208;
  --mid: #2c1a0e;
  --panel: #3a2210;
  --gold: #c9a96e;
  --gold2: #e8c98a;
  --cream: #f5edd8;
  --soft: #faf5ec;
  --muted: #8a6a40;
  --white: #ffffff;
  --card: #fdf8f0;
  --line-green: #06c755;
  --line-bg: #aad7a8;
  --line-chat: #efeeee;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Noto Sans TC', sans-serif; background: var(--soft); color: var(--dark); min-height: 100vh; }

/* HEADER */
header {
  background: var(--dark);
  padding: 0 2rem;
  height: 52px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky; top: 0; z-index: 100;
  border-bottom: 1px solid #3a2810;
}
.logo { font-family: 'Noto Serif TC', serif; color: var(--gold); font-size: 0.95rem; font-weight: 700; letter-spacing: 0.05em; }
.header-sub { font-size: 0.68rem; color: var(--muted); letter-spacing: 0.08em; }

/* APP LAYOUT */
.app { display: grid; grid-template-columns: 280px 1fr 320px; min-height: calc(100vh - 52px); }

/* LEFT SIDEBAR */
.sidebar-left {
  background: var(--dark);
  border-right: 1px solid #3a2810;
  display: flex; flex-direction: column;
  overflow-y: auto;
}
.sb-section { padding: 1rem 1.1rem; border-bottom: 1px solid #2a1a08; }
.sb-label { font-size: 0.62rem; color: var(--muted); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 0.6rem; font-weight: 500; }

/* Scenario tabs */
.scenario-list { display: flex; flex-direction: column; gap: 0.35rem; }
.scenario-btn {
  padding: 0.65rem 0.85rem;
  border: 1px solid #3a2810;
  border-radius: 10px;
  background: transparent;
  cursor: pointer;
  text-align: left;
  transition: all 0.18s;
  color: var(--muted);
}
.scenario-btn:hover { border-color: var(--gold); color: var(--gold2); background: #2a1a08; }
.scenario-btn.active { background: linear-gradient(135deg,#3a2210,#2c1a0e); border-color: var(--gold); color: var(--gold); }
.scenario-tag { font-size: 0.58rem; letter-spacing: 0.08em; margin-bottom: 0.2rem; opacity: 0.75; }
.scenario-name { font-size: 0.82rem; font-weight: 500; font-family: 'Noto Serif TC', serif; }
.scenario-desc { font-size: 0.65rem; margin-top: 0.2rem; line-height: 1.4; }

/* Stage list */
.stage-list { display: flex; flex-direction: column; gap: 0.25rem; }
.stage-btn {
  display: flex; align-items: center; gap: 0.55rem;
  padding: 0.5rem 0.65rem; border-radius: 8px;
  cursor: pointer; border: 1px solid transparent;
  color: var(--muted); font-size: 0.76rem; transition: all 0.15s;
}
.stage-btn:hover { background: #2a1a08; color: var(--cream); }
.stage-btn.active { background: linear-gradient(135deg,#3a2210,#2c1a0e); border-color: #5a3a18; color: var(--gold2); }
.stage-num {
  width: 20px; height: 20px; border-radius: 50%;
  background: #2a1a08; display: flex; align-items: center;
  justify-content: center; font-size: 0.62rem; font-weight: 600;
  flex-shrink: 0; color: var(--muted); transition: all 0.18s;
}
.stage-btn.active .stage-num { background: var(--gold); color: var(--dark); }
.stage-btn.done .stage-num { background: #1e4a2e; color: #4ade80; }
.stage-btn.done { color: #4a6a4a; }

/* Progress */
.prog-bar { height: 3px; background: #2a1a08; border-radius: 2px; overflow: hidden; margin-top: 0.45rem; }
.prog-fill { height: 100%; background: linear-gradient(90deg,var(--gold),var(--gold2)); border-radius: 2px; transition: width 0.4s ease; }
.prog-lbl { font-size: 0.62rem; color: var(--muted); margin-top: 0.25rem; text-align: right; }

/* CENTER - LINE CHAT */
.center { display: flex; flex-direction: column; }

/* LINE header bar */
.line-topbar {
  background: var(--line-green);
  padding: 0.65rem 1rem;
  display: flex; align-items: center; gap: 0.75rem;
  border-bottom: 1px solid #04a844;
}
.line-avatar {
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--white); display: flex; align-items: center;
  justify-content: center; font-size: 1rem; flex-shrink: 0;
}
.line-name { font-size: 0.88rem; font-weight: 500; color: var(--white); }
.line-status { font-size: 0.65rem; color: rgba(255,255,255,0.75); }
.stage-pill {
  margin-left: auto;
  background: rgba(0,0,0,0.2);
  color: var(--white);
  font-size: 0.65rem;
  padding: 0.25rem 0.7rem;
  border-radius: 20px;
  font-weight: 500;
  letter-spacing: 0.05em;
}

/* Chat area */
.chat-area {
  flex: 1; overflow-y: auto;
  background: var(--line-bg);
  padding: 1rem;
  display: flex; flex-direction: column; gap: 0.7rem;
}
.chat-date {
  text-align: center; font-size: 0.65rem;
  color: rgba(0,0,0,0.45); margin: 0.25rem 0;
}

/* LINE bubbles */
.msg-row { display: flex; align-items: flex-end; gap: 0.5rem; }
.msg-row.client { justify-content: flex-start; }
.msg-row.you { justify-content: flex-end; }

.client-avatar {
  width: 30px; height: 30px; border-radius: 50%;
  background: var(--white); display: flex; align-items: center;
  justify-content: center; font-size: 0.75rem; flex-shrink: 0; align-self: flex-start;
}
.bubble-wrap { display: flex; flex-direction: column; max-width: 65%; }
.client .bubble-wrap { align-items: flex-start; }
.you .bubble-wrap { align-items: flex-end; }
.sender-name { font-size: 0.6rem; color: rgba(0,0,0,0.5); margin-bottom: 0.2rem; padding-left: 0.15rem; }

.bubble {
  padding: 0.6rem 0.85rem;
  border-radius: 16px;
  font-size: 0.845rem;
  line-height: 1.65;
  white-space: pre-wrap;
  position: relative;
}
.client .bubble {
  background: var(--white);
  color: #111;
  border-top-left-radius: 4px;
}
.you .bubble {
  background: #c6e88a;
  color: #111;
  border-top-right-radius: 4px;
}
.bubble-time { font-size: 0.6rem; color: rgba(0,0,0,0.4); margin-top: 0.2rem; }

/* Special bubbles */
.system-msg {
  text-align: center; font-size: 0.68rem; color: rgba(0,0,0,0.45);
  background: rgba(255,255,255,0.45); border-radius: 10px;
  padding: 0.4rem 0.8rem; margin: 0.25rem auto; max-width: 80%;
}
.price-card {
  background: var(--white); border-radius: 12px;
  overflow: hidden; max-width: 260px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.12);
}
.price-card-header { background: var(--line-green); padding: 0.65rem 0.9rem; }
.price-card-title { font-size: 0.82rem; font-weight: 600; color: var(--white); }
.price-card-body { padding: 0.75rem 0.9rem; }
.price-row { display: flex; justify-content: space-between; align-items: center; padding: 0.3rem 0; border-bottom: 1px solid #f0ece8; font-size: 0.78rem; }
.price-row:last-child { border-bottom: none; }
.price-name { color: #333; }
.price-amt { font-weight: 600; color: var(--dark); }

/* Stage label in chat */
.stage-label {
  display: flex; align-items: center; gap: 0.5rem;
  margin: 0.5rem 0 0.25rem;
}
.stage-label-line { flex: 1; height: 1px; background: rgba(0,0,0,0.15); }
.stage-label-text { font-size: 0.63rem; color: rgba(0,0,0,0.45); white-space: nowrap; padding: 0 0.25rem; }

/* Nav bar */
.nav-bar {
  background: var(--white);
  border-top: 1px solid #e4d8c8;
  padding: 0.65rem 1rem;
  display: flex; align-items: center; justify-content: space-between;
}
.nav-info { font-size: 0.72rem; color: var(--muted); }
.nav-btns { display: flex; gap: 0.5rem; }
.btn {
  padding: 0.45rem 1.1rem; border-radius: 8px;
  font-size: 0.8rem; font-family: 'Noto Sans TC', sans-serif;
  cursor: pointer; transition: all 0.15s; font-weight: 500;
}
.btn-outline { border: 1px solid #d4c4a8; background: transparent; color: var(--muted); }
.btn-outline:hover { border-color: var(--dark); color: var(--dark); }
.btn-primary { border: none; background: var(--dark); color: var(--gold); }
.btn-primary:hover { background: #2c1a0e; }
.btn:disabled { opacity: 0.3; cursor: default; }

/* RIGHT SIDEBAR - Analysis */
.sidebar-right {
  background: var(--white);
  border-left: 1px solid #e4d8c8;
  overflow-y: auto;
  display: flex; flex-direction: column;
}
.analysis-block { padding: 1.1rem 1.15rem; border-bottom: 1px solid #f0e8d8; }
.analysis-block:last-child { border-bottom: none; }
.a-label {
  font-size: 0.6rem; font-weight: 600; letter-spacing: 0.1em;
  text-transform: uppercase; margin-bottom: 0.55rem;
  display: flex; align-items: center; gap: 0.4rem;
}
.dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.a-analysis { color: var(--muted); }
.a-analysis .dot { background: var(--gold); }
.a-warning { color: #b03020; }
.a-warning .dot { background: #e05040; }
.a-tips { color: #2060a0; }
.a-tips .dot { background: #4090d0; }
.a-purpose { color: #206040; }
.a-purpose .dot { background: #40a060; }

.a-text { font-size: 0.79rem; line-height: 1.75; color: #4a3820; white-space: pre-wrap; }
.warn-box {
  font-size: 0.79rem; line-height: 1.7; color: #7a2818;
  background: #fff0ee; border: 1px solid #f0c8c0;
  border-radius: 8px; padding: 0.65rem 0.8rem;
}
.tip-item {
  font-size: 0.77rem; line-height: 1.55; color: #204060;
  padding: 0.45rem 0.7rem; background: #f0f8ff;
  border-radius: 8px; border-left: 2px solid #4090d0; margin-bottom: 0.4rem;
}
.tip-item:last-child { margin-bottom: 0; }
.purpose-box {
  font-size: 0.79rem; line-height: 1.7; color: #1a4a30;
  background: #f0fff4; border: 1px solid #b8e8c8;
  border-radius: 8px; padding: 0.65rem 0.8rem;
}

/* KEY PHRASE highlight */
.key-phrase {
  display: inline-block;
  background: #fff8e6; border: 1px solid var(--gold);
  border-radius: 6px; padding: 0.15rem 0.5rem;
  font-size: 0.75rem; color: #7a5010; font-weight: 500;
  margin: 0.2rem 0.1rem;
}
.key-phrase-block { margin-top: 0.6rem; }

/* fade */
@keyframes fadeUp { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
.fade-in { animation: fadeUp 0.2s ease forwards; }
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #c8b898; border-radius: 2px; }
</style>
</head>
<body>

<header>
  <div class="logo">小都塔羅 · LINE 接單練習器</div>
  <div class="header-sub">塔羅占卜問事諮詢 · 學員訓練版</div>
</header>

<div class="app">

<!-- LEFT SIDEBAR -->
<aside class="sidebar-left">
  <div class="sb-section">
    <div class="sb-label">客人情境</div>
    <div class="scenario-list">
      <button class="scenario-btn active" onclick="setScenario('love')" id="scn-love">
        <div class="scenario-tag">情境 A</div>
        <div class="scenario-name">「我想要算感情」</div>
        <div class="scenario-desc">有主題直接說，學員要怎麼接、怎麼問、怎麼報價</div>
      </button>
      <button class="scenario-btn" onclick="setScenario('price')" id="scn-price">
        <div class="scenario-tag">情境 B</div>
        <div class="scenario-name">「請問你們怎麼收費」</div>
        <div class="scenario-desc">直接問價格，要不要直接報？怎麼讓她不只是問問</div>
      </button>
      <button class="scenario-btn" onclick="setScenario('silent')" id="scn-silent">
        <div class="scenario-tag">情境 C</div>
        <div class="scenario-name">「我再想想」就消失</div>
        <div class="scenario-desc">報了價格後沒有回應，學員要怎麼跟進不顯得追客</div>
      </button>
      <button class="scenario-btn" onclick="setScenario('vague')" id="scn-vague">
        <div class="scenario-tag">情境 G</div>
        <div class="scenario-name">「我最近運氣很差」</div>
        <div class="scenario-desc">問題模糊，學員怎麼引導客人說出可以排牌的具體問題</div>
      </button>
      <button class="scenario-btn" onclick="setScenario('forbidden')" id="scn-forbidden">
        <div class="scenario-tag">情境 H</div>
        <div class="scenario-name">客人問了禁止類型的題目</div>
        <div class="scenario-desc">健康、投資、一事多問、幫朋友問——怎麼設邊界又不失禮</div>
      </button>
      <button class="scenario-btn" onclick="setScenario('bargain')" id="scn-bargain">
        <div class="scenario-tag">情境 E</div>
        <div class="scenario-name">「可以便宜一點嗎」</div>
        <div class="scenario-desc">直接砍價、比較別人、說預算有限——守住定價又不失客人</div>
      </button>
      <button class="scenario-btn" onclick="setScenario('returning')" id="scn-returning">
        <div class="scenario-tag">情境 K</div>
        <div class="scenario-name">回頭客要求特殊待遇</div>
        <div class="scenario-desc">要折扣、介紹獎勵、說上次不準要補算——怎麼讓她繼續回來又不讓定價崩掉</div>
      </button>
      <button class="scenario-btn" onclick="setScenario('unhappy')" id="scn-unhappy">
        <div class="scenario-tag">情境 I</div>
        <div class="scenario-name">「這個結果我不接受」</div>
        <div class="scenario-desc">算完客人不滿意、說要重算、威脅留負評——守住解析又不失去客人</div>
      </button>
    </div>
  </div>

  <div class="sb-section">
    <div class="sb-label">整體進度</div>
    <div class="prog-bar"><div class="prog-fill" id="prog-fill" style="width:20%"></div></div>
    <div class="prog-lbl" id="prog-lbl">1 / 5 階段</div>
  </div>

  <div class="sb-section" style="flex:1;overflow-y:auto;">
    <div class="sb-label">對話流程</div>
    <div class="stage-list" id="stage-list"></div>
  </div>
</aside>

<!-- CENTER - LINE CHAT -->
<main class="center">
  <div class="line-topbar">
    <div class="line-avatar">🔮</div>
    <div>
      <div class="line-name" id="client-name">小情人</div>
      <div class="line-status">官方帳號</div>
    </div>
    <div class="stage-pill" id="stage-pill">階段 1 · 接觸</div>
  </div>

  <div class="chat-area" id="chat-area">
    <!-- messages render here -->
  </div>

  <div class="nav-bar">
    <div class="nav-info" id="nav-info">情境 A · 感情占卜</div>
    <div class="nav-btns">
      <button class="btn btn-outline" id="nav-prev" onclick="navigate(-1)">← 上一步</button>
      <button class="btn btn-primary" id="nav-next" onclick="navigate(1)">下一步 →</button>
    </div>
  </div>
</main>

<!-- RIGHT SIDEBAR -->
<aside class="sidebar-right" id="analysis-panel"></aside>

</div>

<script>
const TIME = ['10:23','10:24','10:25','10:26','10:27','10:28','10:30','10:32','10:33','10:35','10:36','10:38','10:40','10:42','10:44'];
let timeIdx = 0;
function t() { return TIME[Math.min(timeIdx++, TIME.length-1)]; }

// ─── SCENARIOS ────────────────────────────────────────────────────────────────
const scenarios = {

  // ══ SCENARIO A：感情占卜 ══
  love: {
    clientName: '小情人',
    navInfo: '情境 A · 直接說主題',
    stages: [
      {
        title: '接觸與暖場',
        pill: '階段 1 · 接觸',
        purpose: '客人說了主題（感情），學員的第一句話決定她願不願意繼續聊。',
        chat: [
          { type: 'date', text: '今天' },
          { type: 'system', text: '小情人 加入了官方LINE' },
          { type: 'client', text: '你好，我想要算感情' },
          { type: 'you', text: '你好歡迎來✨\n感情的確是很多人最在意的事情，你來對地方了！\n\n我先簡單問你幾個問題，這樣等一下幫你解牌會更準喔～' },
        ],
        analysis: '第一句話的目的是讓她感覺「這裡是安全的、你懂她」，不是立刻說「好的請問你要算哪個方案」。\n\n你說「感情的確是很多人最在意的事情」——這是共情，讓她覺得被理解，不是被銷售。\n\n最後說「我先問你幾個問題」是在拿主導權，她會進入回答模式。',
        warning: '⚠️ 最常見錯誤：客人說「我想算感情」，學員直接說「好的，我們的感情占卜方案是XXX元」。這樣她會立刻進入防禦模式，覺得你只是在賣她東西。',
        tips: ['第一句要有溫度，讓她感覺被接住', '說「我先問你幾個問題」拿回主導權，不是讓她問你'],
        keyPhrases: ['感情的確是很多人最在意的事情，你來對地方了', '我先簡單問你幾個問題，這樣幫你解牌會更準'],
      },
      {
        title: '問清楚問題',
        pill: '階段 2 · 了解狀況',
        purpose: '在報價之前，先了解她的狀況。這不只是為了解牌，也是讓她感覺「你真的在乎她的問題」。',
        chat: [
          { type: 'you', text: '你現在是單身想了解感情運，還是有在交往中想問特定的事情呢？' },
          { type: 'client', text: '有在交往，想問說我們感情的走向' },
          { type: 'you', text: '好的～這段感情多久了呢？大概的狀態可以說一下嗎，比如說有遇到什麼卡關，還是純粹想確認方向？' },
          { type: 'client', text: '交往快兩年了，最近感覺有點冷淡，我想知道他還有沒有心' },
          { type: 'you', text: '了解了，感覺到對方冷淡又不確定原因，這種感覺真的很煎熬😔\n\n那你想問的核心是「他現在的心意是什麼」，對嗎？還是你也想看接下來這段感情的走向？' },
          { type: 'client', text: '兩個都想知道' },
        ],
        analysis: '問問題的邏輯是：\n1. 先問「狀態」（單身還是交往中）→ 大方向定位\n2. 再問「具體狀況」（多久、遇到什麼）→ 讓她說出痛點\n3. 最後確認「核心問題」→ 這決定你等一下解牌的方向\n\n她說「感覺有點冷淡，想知道他還有沒有心」——這是她真正在意的，後面介紹方案的時候要呼應這個點。',
        warning: null,
        tips: ['問題要一次問一個，不要一口氣問三個問題讓她不知道回哪個', '她說出「很煎熬」的感受時，先共情，再繼續問'],
        keyPhrases: ['感覺到對方冷淡又不確定原因，這種感覺真的很煎熬', '你想問的核心是「他現在的心意是什麼」，對嗎？'],
      },
      {
        title: '介紹服務與報價',
        pill: '階段 3 · 報價',
        purpose: '報價不是列表格，是「告訴她這個方案可以解決她剛才說的問題」。',
        chat: [
          { type: 'you', text: '好，我大概了解你的狀況了～\n\n針對你說的，我建議你做【感情深度解析】，這個方案會幫你看：\n\n✦ 他現在對你的心意和狀態\n✦ 這段感情目前的能量走向\n✦ 接下來你們的相處建議\n\n費用是 NT$800，解牌完我會給你一份完整的文字報告，你可以慢慢看。' },
          { type: 'you', text: '如果你也想另外問「要不要繼續這段感情」或者「有沒有第三者」這類比較深入的問題，可以加購單題占卜 NT$200 一個問題。' },

// ─── STATE ────────────────────────────────────────────────────────────────────
let scenario = 'love';
let stageIdx = 0;

function setScenario(s) {
  scenario = s;
  stageIdx = 0;
  ['love','price','silent','vague','forbidden','bargain','returning','unhappy'].forEach(k => {
    const el = document.getElementById('scn-'+k);
    if (el) el.classList.toggle('active', k === s);
  });
  render();
}

function navigate(d) {
  const total = scenarios[scenario].stages.length;
  stageIdx = Math.max(0, Math.min(total-1, stageIdx+d));
  render();
}

function goStage(i) { stageIdx = i; render(); }

// ─── RENDER ───────────────────────────────────────────────────────────────────
function render() {
  const sc = scenarios[scenario];
  const st = sc.stages[stageIdx];
  const total = sc.stages.length;

  // client name
  document.getElementById('client-name').textContent = sc.clientName;
  document.getElementById('stage-pill').textContent = st.pill;
  document.getElementById('nav-info').textContent = sc.navInfo;

  // progress
  const pct = Math.round(((stageIdx+1)/total)*100);
  document.getElementById('prog-fill').style.width = pct+'%';
  document.getElementById('prog-lbl').textContent = `${stageIdx+1} / ${total} 階段`;

  // stage list
  document.getElementById('stage-list').innerHTML = sc.stages.map((s,i) => `
    <div class="stage-btn ${i===stageIdx?'active':i<stageIdx?'done':''}" onclick="goStage(${i})">
      <div class="stage-num">${i+1}</div>
      <div>${s.title}</div>
    </div>
  `).join('');

  // chat
  const chatEl = document.getElementById('chat-area');
  let msgHTML = '';
  st.chat.forEach((m, i) => {
    const delay = (i*0.04).toFixed(2);
    if (m.type === 'date') {
      msgHTML += `<div class="chat-date fade-in" style="animation-delay:${delay}s">${m.text}</div>`;
    } else if (m.type === 'system') {
      msgHTML += `<div class="system-msg fade-in" style="animation-delay:${delay}s">${m.text}</div>`;
    } else if (m.type === 'client') {
      msgHTML += `
        <div class="msg-row client fade-in" style="animation-delay:${delay}s">
          <div class="client-avatar">👤</div>
          <div class="bubble-wrap client">
            <div class="sender-name">${sc.clientName}</div>
            <div class="bubble client">${m.text.replace(/\n/g,'<br>')}</div>
            <div class="bubble-time">${getTime(i)}</div>
          </div>
        </div>`;
    } else if (m.type === 'you') {
      msgHTML += `
        <div class="msg-row you fade-in" style="animation-delay:${delay}s">
          <div class="bubble-wrap you">
            <div class="sender-name">你</div>
            <div class="bubble you">${m.text.replace(/\n/g,'<br>')}</div>
            <div class="bubble-time">${getTime(i)}</div>
          </div>
        </div>`;
    }
  });
  chatEl.innerHTML = msgHTML;
  chatEl.scrollTop = 0;

  // analysis
  let aHTML = `
    <div class="analysis-block">
      <div class="a-label a-purpose"><span class="dot"></span>這個階段的目的</div>
      <div class="purpose-box">${st.purpose}</div>
    </div>
    <div class="analysis-block">
      <div class="a-label a-analysis"><span class="dot"></span>為什麼這樣說</div>
      <div class="a-text">${st.analysis.replace(/\n/g,'<br>')}</div>
    </div>
  `;
  if (st.warning) {
    aHTML += `
      <div class="analysis-block">
        <div class="a-label a-warning"><span class="dot"></span>常見錯誤</div>
        <div class="warn-box">${st.warning}</div>
      </div>`;
  }
  if (st.tips && st.tips.length) {
    aHTML += `
      <div class="analysis-block">
        <div class="a-label a-tips"><span class="dot"></span>關鍵技巧</div>
        ${st.tips.map(t=>`<div class="tip-item">${t}</div>`).join('')}
      </div>`;
  }
  if (st.keyPhrases && st.keyPhrases.length) {
    aHTML += `
      <div class="analysis-block">
        <div class="a-label a-analysis"><span class="dot"></span>可以直接用的句子</div>
        <div>${st.keyPhrases.map(p=>`<span class="key-phrase">「${p}」</span>`).join('')}</div>
      </div>`;
  }
  document.getElementById('analysis-panel').innerHTML = aHTML;

  // nav btns
  document.getElementById('nav-prev').disabled = stageIdx === 0;
  document.getElementById('nav-next').disabled = stageIdx === total-1;
}

function getTime(i) {
  const base = 10*60+23+i*2;
  const h = Math.floor(base/60);
  const m = base%60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
}

render();
</script>
</body>
</html>
